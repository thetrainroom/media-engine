name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff pyright black

      - name: Ruff check
        run: ruff check media_engine/ cli/ tests/

      - name: Black format check
        run: black --check --line-length 180 media_engine/ cli/ tests/

      - name: Pyright
        run: pyright media_engine/

  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          # CPU-only torch/torchvision first: GitHub runners have no GPU, and
          # the default Linux wheels pull the CUDA stack. easyocr imports
          # torchvision -> torch._dynamo, which imports triton when present -
          # and triton's native module segfaults on the GPU-less runner.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cpu,dev]"
          # openai-whisper pulls triton on Linux as an optional kernel
          # accelerator; remove it so torch._dynamo skips it cleanly
          # (a segfault during import cannot be caught or skipped by pytest).
          pip uninstall -y triton || true

      - name: Run tests
        run: |
          # Tests that require video files will auto-skip via pytest.skip()
          # Stress test is excluded as it requires a running server
          pytest tests/ -v --ignore=tests/stress_test.py

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for hatch-vcs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
